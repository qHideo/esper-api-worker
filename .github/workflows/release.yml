name: Release manifest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.32"
        required: true
        type: string
      channel:
        description: "Update channel"
        required: true
        type: choice
        options: [beta, nightly, stable]
        default: beta

permissions:
  contents: read

concurrency:
  group: release-manifest-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  sign-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: release/go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sign and deploy
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_SEED: ${{ secrets.UPDATE_SIGNING_SEED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "${{ inputs.tag }}" }
          $channel = "${{ inputs.channel }}"
          if (-not $channel) {
            if ("${{ github.event.release.prerelease }}" -eq "true") {
              $channel = "nightly"
            } else {
              $channel = "beta"
            }
          }
          ./ci/release.ps1 -Tag $tag -Channel $channel
